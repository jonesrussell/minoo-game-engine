name: Bug report
description: Report incorrect game or authoring behavior
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include build URL or commit, browser and input method
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or replay evidence
